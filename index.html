<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>暗記カード</title>
<style>
:root{--bg:#f5f6f8;--panel:#fff;--text:#202124;--muted:#70757a;--line:#dfe1e5;--accent:#2563eb;--danger:#dc2626;--green:#16a34a;--shadow:0 4px 18px rgba(0,0,0,.08)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Noto Sans JP","Yu Gothic",sans-serif}
button,input{font:inherit}button{cursor:pointer}
.app{max-width:1100px;margin:auto;padding:18px 16px 40px}.top{display:flex;gap:12px;align-items:center;justify-content:space-between;margin-bottom:18px}
h1{font-size:22px;margin:0}.tabs{display:flex;background:#e9eaee;border-radius:12px;padding:3px}.tab{border:0;background:transparent;padding:9px 16px;border-radius:9px}.tab.active{background:#fff;box-shadow:0 1px 4px #0002;font-weight:700}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px;box-shadow:var(--shadow)}
.hidden{display:none!important}.muted{color:var(--muted)}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.between{justify-content:space-between}
.primary,.secondary,.danger,.success{border:0;border-radius:10px;padding:10px 14px}.primary{background:var(--accent);color:white}.secondary{background:#eef0f3}.danger{background:#fee2e2;color:#991b1b}.success{background:#dcfce7;color:#166534}
input[type=file]{max-width:100%}input[type=text],select{border:1px solid var(--line);border-radius:9px;padding:9px 10px;background:white}
.grid{display:grid;grid-template-columns:280px 1fr;gap:16px}.sidebar{display:flex;flex-direction:column;gap:10px}.file-item{padding:12px;border:1px solid var(--line);border-radius:11px;background:#fff;text-align:left}.file-item.active{border-color:var(--accent);background:#eff6ff}.file-item strong{display:block}.file-item small{color:var(--muted)}
.empty{padding:50px 20px;text-align:center;color:var(--muted)}
.editor-tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px}.tool.active{outline:2px solid var(--accent)}
.canvas-wrap{background:#111;border-radius:12px;overflow:auto;display:flex;justify-content:center;align-items:flex-start;max-height:65vh;padding:10px}
#editCanvas,#studyCanvas{max-width:100%;height:auto;touch-action:none;display:block;cursor:crosshair}
.card-meta{margin:12px 0;color:var(--muted);font-size:13px}.stats{display:flex;gap:10px;flex-wrap:wrap}.stat{background:#f1f3f5;border-radius:9px;padding:8px 10px;font-size:13px}
.study-stage{max-width:850px;margin:auto}.study-tools{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}.study-buttons{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}.study-buttons button{padding:15px;font-weight:700}.history{margin-top:18px}.history-table{width:100%;border-collapse:collapse;font-size:13px}.history-table th,.history-table td{padding:8px;border-bottom:1px solid var(--line);text-align:left}
label.file-label{display:inline-flex;align-items:center;gap:8px;padding:10px 14px;background:#eef0f3;border-radius:10px;cursor:pointer}
@media(max-width:760px){.grid{grid-template-columns:1fr}.top{align-items:flex-start;flex-direction:column}.canvas-wrap{max-height:60vh}.study-buttons{grid-template-columns:1fr}.panel{padding:14px}}
</style>
</head>
<body>
<div class="app">
  <div class="top">
    <h1>暗記カード</h1>
    <div class="tabs">
      <button class="tab active" data-mode="create">作成モード</button>
      <button class="tab" data-mode="study">暗記モード</button>
    </div>
  </div>

  <section id="createView">
    <div class="grid">
      <aside class="panel sidebar">
        <div class="row between"><strong>ファイル</strong><button id="newFile" class="secondary">＋ 新規</button></div>
        <div id="fileList"></div>
        <div class="muted" style="font-size:12px">画像と成績はこのブラウザに保存されます。</div>
      </aside>

      <main class="panel">
        <div id="createEmpty" class="empty">
          <h2>暗記カードを作成</h2>
          <p>文章が写った画像をアップロードし、覚えたい部分をペンで塗りつぶします。</p>
          <div class="row" style="justify-content:center">
            <button id="chooseFileBtn" class="primary" type="button">ファイルから画像を選ぶ</button>
            <button id="choosePhotoBtn" class="secondary" type="button">写真から選ぶ</button>
          </div>
          <input id="imageInput" type="file" accept="image/*" style="position:absolute;left:-9999px;width:1px;height:1px;opacity:0">
          <input id="photoInput" type="file" accept="image/*" capture="environment" style="position:absolute;left:-9999px;width:1px;height:1px;opacity:0">
          <p class="muted" style="font-size:12px">Safariで公開URLを開いている場合、「ファイルから画像を選ぶ」でiPadのファイルアプリを利用できます。</p>
        </div>

        <div id="editor" class="hidden">
          <div class="row between">
            <div>
              <strong id="currentFileName"></strong>
              <div class="muted" id="cardCount"></div>
            </div>
            <div class="row">
              <button id="saveCard" class="primary">カードを保存</button>
              <button id="chooseAnotherBtn" class="secondary" type="button">別の画像を選ぶ</button>
              <input id="imageInput2" type="file" accept="image/*" style="position:absolute;left:-9999px;width:1px;height:1px;opacity:0">
            </div>
          </div>
          <hr style="border:0;border-top:1px solid var(--line);margin:14px 0">
          <div class="editor-tools">
            <button id="penBtn" class="secondary tool active">ペン</button>
            <button id="eraserBtn" class="secondary tool">消しゴム</button>
            <label>太さ <input id="brushSize" type="range" min="4" max="80" value="28"></label>
            <button id="clearMask" class="danger">塗りつぶしを全消去</button>
          </div>
          <div class="canvas-wrap"><canvas id="editCanvas"></canvas></div>
          <p class="muted" style="font-size:13px">画像上をドラッグして塗りつぶします。消しゴムで塗りつぶしだけを消せます。元画像は変更されません。</p>
        </div>
      </main>
    </div>
  </section>

  <section id="studyView" class="hidden">
    <div class="panel study-stage">
      <div id="studyEmpty" class="empty">
        <h2>暗記モード</h2>
        <p>まず作成モードでカードを作ってください。</p>
      </div>
      <div id="studyContent" class="hidden">
        <div class="study-tools">
          <div>
            <strong id="studyFileName"></strong>
            <div class="muted" id="studyProgress"></div>
          </div>
          <div class="row">
            <select id="orderMode">
              <option value="sequential">設定順</option>
              <option value="random">ランダム</option>
            </select>
            <button id="restartStudy" class="secondary">最初から</button>
          </div>
        </div>
        <div class="canvas-wrap"><canvas id="studyCanvas"></canvas></div>
        <p class="muted" style="font-size:13px">塗りつぶされた場所をタップすると、その場所だけ答えが表示されます。</p>
        <div class="study-buttons">
          <button id="remembered" class="success">覚えていた</button>
          <button id="notRemembered" class="danger">覚えていない</button>
        </div>
        <div class="history">
          <h3>このカードの直近の成績</h3>
          <div id="cardStats"></div>
        </div>
      </div>
    </div>
  </section>
</div>

<script>
const DB_KEY="memorizeCards_v1";
let db=loadDB();
let currentFileId=null,currentCardId=null;
let editImage=null, editMask=null, editCtx=null, drawing=false, tool="pen";
let studyQueue=[], studyPos=0, studyReveal=new Set();

function loadDB(){try{return JSON.parse(localStorage.getItem(DB_KEY))||{files:[]}}catch(e){return {files:[]}}}
function saveDB(){localStorage.setItem(DB_KEY,JSON.stringify(db))}
function uid(){return Date.now().toString(36)+"-"+Math.random().toString(36).slice(2,8)}
function esc(s){return String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
function currentFile(){return db.files.find(f=>f.id===currentFileId)}
function currentCard(){let f=currentFile();return f&&f.cards.find(c=>c.id===currentCardId)}

function renderFiles(){
 const el=document.getElementById("fileList");
 if(!db.files.length){el.innerHTML='<div class="muted" style="padding:10px 2px">まだファイルがありません。</div>';return}
 el.innerHTML=db.files.map(f=>`<button class="file-item ${f.id===currentFileId?'active':''}" data-id="${f.id}"><strong>${esc(f.name)}</strong><small>${f.cards.length}枚</small></button>`).join("");
 el.querySelectorAll(".file-item").forEach(b=>b.onclick=()=>selectFile(b.dataset.id));
}
function selectFile(id){currentFileId=id;currentCardId=null;renderFiles();renderEditor()}
function renderEditor(){
 const f=currentFile();
 document.getElementById("createEmpty").classList.toggle("hidden",!!f);
 document.getElementById("editor").classList.toggle("hidden",!f);
 if(!f)return;
 document.getElementById("currentFileName").textContent=f.name;
 document.getElementById("cardCount").textContent=`${f.cards.length}枚のカード`;
 if(f.cards.length&&!currentCardId) currentCardId=f.cards[f.cards.length-1].id;
 if(currentCardId) loadCardToEditor(currentCardId);
}
function createFile(){
 const name=prompt("ファイル名を入力","新しい暗記セット");
 if(!name)return;
 const f={id:uid(),name:name.trim()||"無題",cards:[]};db.files.push(f);currentFileId=f.id;currentCardId=null;saveDB();renderFiles();renderEditor();
}
document.getElementById("newFile").onclick=createFile;

function readImage(file){
 return new Promise((resolve,reject)=>{
   if(!file){reject(new Error("画像が選択されていません"));return}
   const r=new FileReader();
   r.onload=()=>{
     const im=new Image();
     im.onload=()=>resolve(im);
     im.onerror=()=>reject(new Error("画像を読み込めませんでした"));
     im.src=r.result;
   };
   r.onerror=()=>{
     try{
       const url=URL.createObjectURL(file);
       const im=new Image();
       im.onload=()=>{URL.revokeObjectURL(url);resolve(im)};
       im.onerror=()=>{URL.revokeObjectURL(url);reject(new Error("画像を読み込めませんでした"))};
       im.src=url;
     }catch(err){reject(err)}
   };
   r.readAsDataURL(file);
 })
}
async function upload(file){
 if(!file)return;
 try {
 if(!currentFileId){
   const f={id:uid(),name:file.name.replace(/\.[^.]+$/,"")||"暗記セット",cards:[]};db.files.push(f);currentFileId=f.id;
 }
 const im=await readImage(file);
 const c={id:uid(),image:im.src,mask:null,history:[],createdAt:Date.now()};
 currentFile().cards.push(c);currentCardId=c.id;saveDB();renderFiles();renderEditor();
 } catch(err) {
   console.error(err);
   alert("画像を読み込めませんでした。写真・画像ファイル（JPG / PNG / WebP）を選択してください。");
 }
}
const imageInput=document.getElementById("imageInput");
const imageInput2=document.getElementById("imageInput2");
const photoInput=document.getElementById("photoInput");
document.getElementById("chooseFileBtn").addEventListener("click",()=>imageInput.click());
document.getElementById("choosePhotoBtn").addEventListener("click",()=>photoInput.click());
document.getElementById("chooseAnotherBtn").addEventListener("click",()=>imageInput2.click());
imageInput.addEventListener("change",async e=>{const file=e.target.files&&e.target.files[0];if(file) await upload(file);e.target.value="";});
imageInput2.addEventListener("change",async e=>{const file=e.target.files&&e.target.files[0];if(file) await upload(file);e.target.value="";});
photoInput.addEventListener("change",async e=>{const file=e.target.files&&e.target.files[0];if(file) await upload(file);e.target.value="";});

function setupCanvas(canvas,im){
 const maxW=Math.min(1000,im.naturalWidth||im.width);
 const scale=Math.min(1,maxW/(im.naturalWidth||im.width));
 canvas.width=Math.round((im.naturalWidth||im.width)*scale);
 canvas.height=Math.round((im.naturalHeight||im.height)*scale);
 const ctx=canvas.getContext("2d");
 ctx.drawImage(im,0,0,canvas.width,canvas.height);
 return {scale,ctx};
}
function loadCardToEditor(id){
 const c=currentFile().cards.find(x=>x.id===id);if(!c)return;
 currentCardId=id; editImage=new Image();editImage.onload=()=>{
   const cv=document.getElementById("editCanvas"),r=setupCanvas(cv,editImage);editCtx=r.ctx;
   editMask=document.createElement("canvas");editMask.width=cv.width;editMask.height=cv.height;
   if(c.mask){const m=new Image();m.onload=()=>{editMask.getContext("2d").drawImage(m,0,0,cv.width,cv.height);drawEditor()};m.src=c.mask}else drawEditor();
 };editImage.src=c.image;
}
function drawEditor(){editCtx.clearRect(0,0,editCanvas.width,editCanvas.height);editCtx.drawImage(editImage,0,0,editCanvas.width,editCanvas.height);editCtx.drawImage(editMask,0,0)}
function pointerPos(e,canvas){const r=canvas.getBoundingClientRect();return {x:(e.clientX-r.left)*canvas.width/r.width,y:(e.clientY-r.top)*canvas.height/r.height}}
function paint(e){
 if(!drawing)return;const p=pointerPos(e,editCanvas),m=editMask.getContext("2d"),size=+document.getElementById("brushSize").value;
 m.save();m.globalCompositeOperation=tool==="pen"?"source-over":"destination-out";
 m.fillStyle="#000";m.beginPath();m.arc(p.x,p.y,size/2,0,Math.PI*2);m.fill();m.restore();drawEditor();
}
editCanvas.addEventListener("pointerdown",e=>{drawing=true;editCanvas.setPointerCapture(e.pointerId);paint(e)});
editCanvas.addEventListener("pointermove",paint);
editCanvas.addEventListener("pointerup",()=>drawing=false);editCanvas.addEventListener("pointercancel",()=>drawing=false);
document.getElementById("penBtn").onclick=()=>{tool="pen";toggleTools()};
document.getElementById("eraserBtn").onclick=()=>{tool="eraser";toggleTools()};
function toggleTools(){document.querySelectorAll(".tool").forEach(x=>x.classList.remove("active"));document.getElementById(tool==="pen"?"penBtn":"eraserBtn").classList.add("active")}
document.getElementById("clearMask").onclick=()=>{editMask.getContext("2d").clearRect(0,0,editMask.width,editMask.height);drawEditor()};
document.getElementById("saveCard").onclick=()=>{
 const c=currentCard();if(!c)return;c.mask=editMask.toDataURL("image/png");saveDB();renderFiles();alert("カードを保存しました。");
};

function setMode(mode){
 document.querySelectorAll(".tab").forEach(b=>b.classList.toggle("active",b.dataset.mode===mode));
 document.getElementById("createView").classList.toggle("hidden",mode!=="create");
 document.getElementById("studyView").classList.toggle("hidden",mode!=="study");
 if(mode==="study") initStudy();
}
document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>setMode(b.dataset.mode));

function getCards(){return db.files.flatMap(f=>f.cards.map(c=>({...c,file:f})))}
function initStudy(){
 const cards=getCards().filter(c=>c.mask);
 if(!cards.length){document.getElementById("studyEmpty").classList.remove("hidden");document.getElementById("studyContent").classList.add("hidden");return}
 document.getElementById("studyEmpty").classList.add("hidden");document.getElementById("studyContent").classList.remove("hidden");
 if(!currentFileId||!db.files.find(f=>f.id===currentFileId))currentFileId=cards[0].file.id;
 buildQueue();
}
document.getElementById("orderMode").onchange=()=>buildQueue();
document.getElementById("restartStudy").onclick=()=>buildQueue();
function buildQueue(){
 const f=currentFile()||db.files.find(x=>x.cards.some(c=>c.mask));if(!f)return;
 currentFileId=f.id;let cards=f.cards.filter(c=>c.mask).slice();
 if(document.getElementById("orderMode").value==="random") cards.sort(()=>Math.random()-.5);
 studyQueue=cards;studyPos=0;studyReveal=new Set();showStudyCard();
}
function showStudyCard(){
 if(!studyQueue.length)return;
 const c=studyQueue[studyPos];currentCardId=c.id;studyReveal=new Set();
 document.getElementById("studyFileName").textContent=currentFile().name;
 document.getElementById("studyProgress").textContent=`${studyPos+1} / ${studyQueue.length}`;
 drawStudy(c);renderStats(c);
}
function drawStudy(c){
 const im=new Image();im.onload=()=>{
   const cv=document.getElementById("studyCanvas"),r=setupCanvas(cv,im),ctx=r.ctx;
   const mask=new Image();mask.onload=()=>{
     ctx.save();ctx.drawImage(im,0,0,cv.width,cv.height);
     ctx.drawImage(mask,0,0,cv.width,cv.height);
     // Revealed regions are approximated by erasing mask circles where tapped.
     if(studyReveal.size){
       const cover=document.createElement("canvas");cover.width=cv.width;cover.height=cv.height;
       const cc=cover.getContext("2d");cc.drawImage(mask,0,0,cv.width,cv.height);
       cc.globalCompositeOperation="destination-out";
       studyReveal.forEach(p=>{cc.beginPath();cc.arc(p.x,p.y,p.r,0,Math.PI*2);cc.fill()});
       ctx.drawImage(im,0,0,cv.width,cv.height);
       ctx.drawImage(cover,0,0);
     }
     ctx.restore();
   };mask.src=c.mask;
 };im.src=c.image;
}
document.getElementById("studyCanvas").addEventListener("pointerdown",e=>{
 const cv=e.currentTarget,c=currentCard();if(!c||!c.mask)return;
 const p=pointerPos(e,cv),r=Math.max(18,cv.width*.035);studyReveal.add({x:p.x,y:p.y,r});
 drawStudy(c);
});
function record(result){
 const c=currentCard();if(!c)return;
 if(!c.history)c.history=[];
 c.history.push({result,at:Date.now()});if(c.history.length>20)c.history.shift();saveDB();
 studyPos++;if(studyPos>=studyQueue.length){alert("このセットの出題が終了しました。");studyPos=0;buildQueue();return}
 showStudyCard();
}
document.getElementById("remembered").onclick=()=>record(true);
document.getElementById("notRemembered").onclick=()=>record(false);

function renderStats(c){
 const h=c.history||[], recent=h.slice(-10).reverse();
 const remembered=h.filter(x=>x.result).length, total=h.length;
 document.getElementById("cardStats").innerHTML=total
 ? `<div class="stats"><div class="stat">累計 ${total}回</div><div class="stat">覚えていた ${remembered}回</div><div class="stat">直近成功率 ${Math.round(remembered/total*100)}%</div></div>
 <table class="history-table"><thead><tr><th>日時</th><th>結果</th></tr></thead><tbody>${recent.map(x=>`<tr><td>${new Date(x.at).toLocaleString("ja-JP")}</td><td>${x.result?"覚えていた":"覚えていない"}</td></tr>`).join("")}</tbody></table>`
 : '<div class="muted">まだ成績はありません。</div>';
}
renderFiles();
if(db.files.length){currentFileId=db.files[0].id;renderEditor()}
</script>
</body>
</html>
